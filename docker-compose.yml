services:
  ds2api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ds2api:latest
    container_name: ds2api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${DS2API_HOST_PORT:-8080}:8080"
    volumes:
      # Mount your config.json to /app/config.json (default DS2API_CONFIG_PATH).
      - ./config.json:/app/config.json:ro
      # Persistent state (e.g. runtime_stats, response store).
      - ./data:/app/data
    environment:
      - TZ=UTC
      - LOG_LEVEL=INFO
      - DS2API_CONFIG_PATH=/app/config.json
      # Set DS2API_HOT_RELOAD=true to enable fsnotify-based config reload.
      - DS2API_HOT_RELOAD=${DS2API_HOT_RELOAD:-false}
