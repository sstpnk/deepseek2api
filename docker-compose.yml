services:
  ds2api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-from-source
    image: ds2api-local:latest
    container_name: ds2api
    restart: always
    env_file:
      - .env
    ports:
      # Host port is configurable via DS2API_HOST_PORT; container port stays fixed at 5001.
      - "${DS2API_HOST_PORT:-6011}:5001"
    volumes:
      - ./config.json:/data/config.json   # 配置文件（持久化推荐路径，跟随 dev 4.2.0）
      - ./data:/app/data                  # 聊天历史与持久化数据（host bind 保留）
    environment:
      - TZ=Asia/Shanghai
      - LOG_LEVEL=INFO
      - DS2API_CONFIG_PATH=/data/config.json
